<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fitness Coach: 3D-Prototyp</title>
<style>
  :root{--bg:#f4f5f7;--fg:#22252a;--card:linear-gradient(#fbfbfc,#e9ecf0);--btn:#e3e5ea;--muted:#6b7078;--accent:#22252a;--accentFg:#fff}
  [data-theme=dark]{--bg:#15171b;--fg:#e8eaee;--card:linear-gradient(#20242a,#15181d);--btn:#2a2e35;--muted:#9aa0aa;--accent:#e8eaee;--accentFg:#15171b}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);transition:background .2s}
  .wrap{max-width:720px;margin:auto;padding:12px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{border:0;padding:8px 12px;border-radius:8px;background:var(--btn);color:var(--fg);font-size:14px;cursor:pointer}
  button.on{background:var(--accent);color:var(--accentFg)}
  .sp{flex:1}
  #v{height:min(70vh,520px);background:var(--card);border-radius:14px;margin:10px 0;touch-action:none}
  .ctl{display:flex;gap:10px;align-items:center}
  input[type=range]{flex:1;accent-color:#e0242b}
  .leg{font-size:14px}.leg span{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 12px;vertical-align:-1px}
  .hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body><div class="wrap">
<div class="bar"><span id="tabs" class="bar"></span><span class="sp"></span><button id="reset" title="Ansicht zurücksetzen">⟲</button><button id="theme" title="Hell/Dunkel">🌙</button></div>
<div id="v"></div>
<div class="ctl"><button id="play">⏸</button><input id="t" type="range" min="0" max="1000" value="0"><span id="pct">0%</span></div>
<p class="leg"><span style="background:#e0242b"></span>Hauptmuskel<span style="background:#f0876f"></span>Hilfsmuskel<span style="background:#9ea4ad"></span>nicht beteiligt</p>
<p class="hint">Ziehen zum Drehen um das Modell, zwei Finger oder Mausrad zum Zoomen. Das Modell bleibt immer in der Mitte.</p>
</div>
<script type="module">
import { ExerciseViewer } from './viewer.js';
import { ANIMS } from './anims.js';
const EX = {
  chest_press: { name: 'Brustpresse', m: { primary: ['chest'], secondary: ['front_delt', 'triceps', 'chest_upper'] } },
  lat_pulldown_wide: { name: 'Latzug breit', m: { primary: ['lats'], secondary: ['biceps', 'rhomboids', 'rear_delt', 'traps'] } },
};
let theme = 'light';
try { theme = localStorage.getItem('fc-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
document.documentElement.dataset.theme = theme;
const v = new ExerciseViewer(document.getElementById('v'), { theme });
window.viewer = v;
const $ = (id) => document.getElementById(id);
const tabs = $('tabs'), slider = $('t'), pct = $('pct'), pb = $('play'), tb = $('theme');
tb.textContent = theme === 'dark' ? '☀️' : '🌙';
function sel(id) {
  [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.id === id));
  v.setExercise(ANIMS[id], EX[id].m); v.play(true); pb.textContent = '⏸';
}
for (const [id, e] of Object.entries(EX)) { const b = document.createElement('button'); b.textContent = e.name; b.dataset.id = id; b.onclick = () => sel(id); tabs.append(b); }
v.onTick = (t) => { slider.value = Math.round(t * 1000); pct.textContent = Math.round(t * 100) + '%'; };
slider.oninput = () => { v.play(false); pb.textContent = '▶'; v.setT(slider.value / 1000); pct.textContent = Math.round(slider.value / 10) + '%'; };
pb.onclick = () => { v.play(!v.playing); pb.textContent = v.playing ? '⏸' : '▶'; };
$('reset').onclick = () => v.resetView();
tb.onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme; v.setTheme(theme); tb.textContent = theme === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('fc-theme', theme); } catch (e) {}
};
const q = new URLSearchParams(location.search);
if (q.get('theme')) { theme = q.get('theme') === 'dark' ? 'light' : 'dark'; tb.onclick(); }
sel(q.get('ex') || 'chest_press');
</script>
</body></html>
